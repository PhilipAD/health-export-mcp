name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the long-standing CI baseline; 24 is what the release workflow publishes from.
        node-version: ['20', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: node --check server.mjs
      - name: Integration tests
        run: npm test
      # Runs on every push, not only at publish time. CI checks out a CLEAN tree, so on its own it
      # would never see the untracked local files that leaked into 1.2.0 — its job here is to catch
      # a bad `files` allowlist or a forbidden path committed to the repo. The prepublishOnly hook
      # is what guards the working directory an actual publish is packed from.
      - name: Publish tarball contains only the server
        run: npm run check:package
